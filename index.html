<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KEMEROVO RP</title>
<style>
:root{--p1:#2d3843;--p2:#1c252e;--ln:#c9cdd0;--bl:#1d2fe8;--or:#ff7a1a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
body{margin:0;background:#000;color:#fff;font:15px/1.35 Roboto,"Segoe UI",Arial,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:6px 10px 0}
.lg{width:28px;height:28px}.br{font-size:12px;color:#b9c0c6;margin-right:10px}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:#fff;font:11px Roboto,Arial,sans-serif;padding:8px 10px 6px;cursor:pointer}
.tab.on{border-color:#3d9bff}
#st{font-size:11px;color:var(--or);padding:2px 12px;min-height:18px}
#main{margin:0 8px 8px;border:2px solid var(--ln);border-radius:6px;background:linear-gradient(var(--p1),var(--p2));overflow:hidden}
.bar{background:linear-gradient(#e2e4e6,#aeb2b5);color:var(--bl);font-size:20px;font-weight:500;text-align:center;padding:6px 8px}
.btn{background:linear-gradient(#f4f4f4,#c2c2c2);color:#1b1b1b;border:1px solid #8c8c8c;border-radius:3px;padding:10px 14px;font:inherit;font-size:16px;min-height:44px;cursor:pointer}
.btn:active{background:#b5b5b5}
.menu{display:grid;gap:14px;padding:22px 16px;max-width:420px;margin:auto}
.menu .btn{font-size:20px;padding:22px}
.split{display:grid;grid-template-columns:minmax(210px,36%) 1fr}
.split>div:first-child{border-right:2px solid var(--ln)}
.split>div:first-child>.btn{margin:0 6px 6px;width:calc(100% - 12px)}
.list{list-style:none;margin:0;padding:6px;display:grid;gap:6px;max-height:60vh;overflow:auto}
.it{position:relative;background:#3a4753;border:1px solid #5d6b78;border-radius:3px;padding:8px 70px 8px 10px;cursor:pointer}
.it b{display:block;font-weight:500}
.it i{position:absolute;top:6px;right:8px;font-size:11px;font-style:normal;color:#c8d0d6}
.it span{display:block;font-size:12px;color:var(--or)}
.it em{position:absolute;right:8px;bottom:6px;font-size:12px;font-style:normal;color:#8a959e}
.it.sel{border-color:var(--ln);box-shadow:inset 0 0 0 1px var(--ln)}
.it.done{background:#12171c;color:#66717a;border-color:#252d34}
.it.done span{color:#66717a}
.blink{animation:bl .5s steps(1) 6}
@keyframes bl{50%{background:var(--or);color:#000}}
.empty{color:#9aa5ad;padding:10px}
.pn{padding:10px 12px}
.pn p{margin:6px 0}.pn u{text-decoration:none;color:var(--or)}
label{display:block;color:var(--or);font-size:13px;margin:8px 0 3px}
input,textarea{width:100%;background:#141b22;color:#fff;border:1px solid #5d6b78;border-radius:3px;padding:8px;font:inherit}
.err{border-color:#e8331c}
.pn>.btn{width:100%;margin-top:12px}
.chk{display:flex;gap:8px;margin:12px 0}.chk .btn{flex:1}
.ck.on{background:linear-gradient(#7fdc4a,#4aa51f);color:#fff;border-color:#2e7a10}
.ck.on::before{content:"✓ "}
@media(max-width:700px){.split{grid-template-columns:1fr}.split>div:first-child{border:0;border-bottom:2px solid var(--ln)}}
</style></head><body>
